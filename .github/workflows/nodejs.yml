name: build

on: [push, pull_request]

permissions:
   contents: read

jobs:
  test-windows:
    name: Test on node ${{ matrix.node-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: git config user.email
      run: git config --global "user.email" "noreply@no.reply"
    - name: git config user.name
      run: git config --global "user.name" "Unit Test"
    - name: Install Mercurial on Windows (1)
      if: runner.os == 'Windows'
      run: choco install hg -y
    - name: Install Mercurial on Windows (2)
      if: runner.os == 'Windows'
      run: refreshenv
    - name: Check Mercurial installed
      run: hg --version
    - name: npm install
      run: npm install
    - name: npm test
      run: npm run test
      env:
        CI: true
  # macOS does not have Mercurial preinstalled
  test-macos:
    name: Test on node ${{ matrix.node-version }} and macOS
    runs-on: macos-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install, and test
      run: |
        brew install mercurial
        git config --global "user.email" "noreply@no.reply"
        git config --global "user.name" "Unit Test"
        npm install
        npm run test
      env:
        CI: true
